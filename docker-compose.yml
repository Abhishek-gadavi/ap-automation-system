services:
  # ============================================================================
  # 1. PostgreSQL Database Service (Compulsory Database Stack)
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: ap_postgres_container
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accounts_payable_db}
      POSTGRES_USER: ${POSTGRES_USER:-accounts_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accounts_secure_pwd_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/2_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-accounts_user} -d ${POSTGRES_DB:-accounts_payable_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 2. Django Backend Service (Django REST Framework + OCR)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ap_django_backend_container
    restart: always
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python seed_data.py &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - ./sample_invoices:/app/sample_invoices
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - USE_POSTGRES=True
    depends_on:
      db:
        condition: service_healthy

  # ============================================================================
  # 3. ReactJS Frontend Service (Single Page Application)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ap_react_frontend_container
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
    name: accounts_payable_postgres_volume
